  <link rel="apple-touch-icon" href="favicon.png?v=2">

<body>
  <div class="page-loader page-loader--history" aria-hidden="true">

      <div class="page-loader-cook" aria-hidden="true"><span class="page-loader-steam"></span><span class="page-loader-steam"></span><span class="page-loader-steam"></span><div class="page-loader-pot"></div></div>
    </div>
  </div>
  <div class="app">
    <div class="app-shell container-xxl">
      <header class="topbar">
        <div class="brand">
          <a href="cook_bot.html" aria-label="Go to CookBot home">
            <img src="assets/images/COOK_BOT_LOGO.png" alt="CookBot" class="brand-logo">
          </a>
        </div>
      </header>

      <section class="page-heading">
        <h2>API Test</h2>
      </section>

      <main class="history-shell">
        <section class="about-section-card">
          <h3 class="meal-plan-title">Register Request</h3>
          <form id="registerTestForm" class="login-form" autocomplete="off">
            <div class="auth-field">
              <label for="registerFullName">Full Name</label>
              <div class="auth-input-wrap">
                <input id="registerFullName" type="text" value="Test User">
              </div>
            </div>
            <div class="auth-field">
              <label for="registerEmail">Email</label>
              <div class="auth-input-wrap">
                <input id="registerEmail" type="email" value="test@example.com">
              </div>
            </div>
            <div class="auth-field">
              <label for="registerPassword">Password</label>
              <div class="auth-input-wrap">
                <input id="registerPassword" type="text" value="password123">
              </div>
            </div>
            <button type="submit" class="primary-btn login-submit">Send Register POST</button>
          </form>
        </section>

        <section class="about-section-card">
          <h3 class="meal-plan-title">Login Request</h3>
          <form id="loginTestForm" class="login-form" autocomplete="off">
            <div class="auth-field">
              <label for="loginEmail">Email</label>
              <div class="auth-input-wrap">
                <input id="loginEmail" type="email" value="test@example.com">
              </div>
            </div>
            <div class="auth-field">
              <label for="loginPassword">Password</label>
              <div class="auth-input-wrap">
                <input id="loginPassword" type="text" value="password123">
              </div>
            </div>
            <button type="submit" class="primary-btn login-submit">Send Login POST</button>
          </form>
        </section>

        <section class="about-section-card">
          <h3 class="meal-plan-title">Response</h3>
          <pre id="apiResponse" class="generated-reply" style="white-space:pre-wrap; min-height:140px;">Ready.</pre>
        </section>
      </main>

      <footer class="site-footer">
        <p>CookBot keeps your recipes, history, and weekly plans together.</p>
        <div class="site-footer-links">
          <a href="about.html">About</a>
          <a href="help_center.html">Help Center</a>
        </div>
        <p class="site-footer-copy">&copy; 2026 CookBot. All rights reserved.</p>
      </footer>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item" aria-label="Home" data-nav="home">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11.5 12 4l9 7.5"></path>
            <path d="M5.5 10.5V20h5v-5h3v5h5v-9.5"></path>
          </svg>
        </span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" aria-label="History" data-nav="history">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <path d="M3 4v5h5"></path>
            <path d="M12 7.5V12l3 2"></path>
          </svg>
        </span>
        <span class="nav-label">History</span>
      </button>
      <button class="nav-item" aria-label="Favorite" data-nav="favorite">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3 2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8-4.2-4.1 5.9-.9Z"></path>
          </svg>
        </span>
        <span class="nav-label">Favorite</span>
      </button>
      <button class="nav-item" aria-label="Meal Plan" data-nav="meal-plan">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="3"></rect>
            <path d="M8 4v16"></path>
            <path d="M12 8h4"></path>
            <path d="M12 12h4"></path>
            <path d="M12 16h4"></path>
          </svg>
        </span>
        <span class="nav-label">Meal Plan</span>
      </button>
      <button class="nav-item" aria-label="More" data-nav="more">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5" cy="12" r="1.6"></circle>
            <circle cx="12" cy="12" r="1.6"></circle>

          </svg>
        </span>
        <span class="nav-label">More</span>
      </button>
    </nav>
  </div>

  <script>
    const API_BASE = "";

    async function sendJson(path, payload){
      const response = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const body = await response.json().catch(() => ({}));
      return {
        status: response.status,
        ok: response.ok,
        body
      };
    }

    function renderResponse(data){
      const node = document.getElementById("apiResponse");
      if(!node) return;
      node.textContent = JSON.stringify(data, null, 2);
    }

    document.getElementById("registerTestForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = await sendJson("api/auth/register.php", {
        fullName: document.getElementById("registerFullName").value,
        email: document.getElementById("registerEmail").value,
        password: document.getElementById("registerPassword").value
      });
      renderResponse(result);
    });

    document.getElementById("loginTestForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = await sendJson("api/auth/login.php", {
        email: document.getElementById("loginEmail").value,
        password: document.getElementById("loginPassword").value
      });
      renderResponse(result);
    });
  </script>
  <script src="src/scripts/favorites.js" defer></script>
  <script src="src/scripts/page-loader.js" defer></script>
</body>
</html>
